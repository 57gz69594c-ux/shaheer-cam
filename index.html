<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no" />
<title>Film Camera</title>
<link rel="stylesheet" href="style.css?v=15" />
</head>
<body>
  <div id="app">

    <!-- live camera view -->
    <div id="liveView">
      <canvas id="preview"></canvas>
      <video id="cam" playsinline muted autoplay></video>

      <div id="filterLabel">Polaroid</div>
      <div id="recIndicator" class="hidden">&#9679; REC 0:00</div>
      <button id="rotateBtn" title="fix orientation">⟳</button>
      <button id="galleryBtn" title="view saved photos">▤</button>

      <div id="controls">
        <button id="switchBtn" aria-label="switch film">◀ ▶</button>
        <button id="shutterBtn" aria-label="start recording"></button>
        <button id="borderBtn" aria-label="toggle polaroid border">▭</button>
      </div>
    </div>

    <!-- captured photo/video review -->
    <div id="reviewView" class="hidden">
      <canvas id="result"></canvas>
      <video id="resultVideo" class="hidden" playsinline controls></video>
      <div id="reviewControls">
        <button id="retakeBtn">Back</button>
        <button id="emailBtn">Email</button>
        <button id="saveBtn">Save</button>
      </div>
    </div>

    <!-- saved photo/video gallery -->
    <div id="galleryView" class="hidden">
      <canvas id="galleryCanvas"></canvas>
      <video id="galleryVideo" class="hidden" playsinline controls></video>
      <div id="galleryGrid" class="hidden"></div>
      <div id="galleryEmpty" class="hidden">No photos saved yet</div>
      <div id="galleryCounter"></div>
      <button id="galleryGridBtn" title="grid view">⊞</button>
      <div id="galleryControls">
        <button id="galleryBackBtn">Back</button>
        <button id="galleryDeleteBtn">Delete</button>
        <button id="galleryEmailBtn">Email</button>
        <button id="gallerySaveBtn">Save</button>
      </div>
    </div>

    <div id="errorBox" class="hidden"></div>
    <div id="toast" class="hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
